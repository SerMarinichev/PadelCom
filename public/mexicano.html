<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PadelCom · Mexicano</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=PT+Sans:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'PT Sans', system-ui, sans-serif; background: #F5F3ED; }
  input, select, button, textarea { font-family: inherit; }
  /* Safety net for the iOS focus-zoom problem: anything under 16px makes Safari
     zoom the viewport on focus, and in standalone (home-screen) mode it often
     doesn't zoom back out. Inline styles already set 16px; this catches any
     field that doesn't go through them. */
  input, select, textarea { font-size: 16px; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/mexicano-bundle.js"></script>
</body>
</html>
